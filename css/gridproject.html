<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .main{
            height: 369px;
            width: 669px;
            background-color: rgb(53, 35, 70);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
        }
        .container{
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(3,200px);
            gap: 20px;
            background-color: rgb(38, 22, 53);
            border-radius: 20px;
        }
        .div1{
            background-color: blueviolet;
            border-radius: 20px;
            color: aliceblue;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
        }
        .div1 h6 {
            margin: 0;
        }
        .icons-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center; 
            align-items: center;    
            gap: 8px;
        }
        .c {
            height: 37px;
            width: 39px;
            border-radius: 50%;
            background-color: aliceblue;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .c img {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .div2{
            background-color: blueviolet;
            border-radius: 20px;
        }
        .div3{
            background-color: blueviolet;
            border-radius: 20px;
        }
        .div4{
            background-color: blueviolet;
            border-radius: 20px;
            color: aliceblue;
            display: flex;
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: flex-start;    
            padding: 15px;              
            box-sizing: border-box;
        }
        .div4 h6 {
            margin: 0 0 2px 0;          
            font-size: 14px;
            opacity: 0.8;
        }
        .div4 h1 {
            margin: 0;
            font-size: 46px;            
            line-height: 1;
        }
        .div5{
            background-color: rgb(100, 3, 255);
            border-radius: 20px;
            color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .div5 h1 {
            margin: 0;
            font-size: 28px;
        }
        .div6{
            grid-column: 3/4;
            grid-row: 2/4;
            background-color: rgb(250, 250, 250);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;  
            align-items: center;        
            padding: 20px;
            box-sizing: border-box;
        }
        .div6 h1 {
            margin: 0;
            font-size: 56px;            
            color: #261635;
        }
        .div7{
            grid-column: 1/3;
            grid-row: 3/4;
            background-color: rgb(123, 98, 148);
            border-radius: 20px;
            color: aliceblue;
            padding-left: 15px;
            margin-top: 2px;
        }
        </style>
</head>
<body>
    <div class="main">
    <div class="container">
        <div class="div1">
            <h6>A complete family of Apps</h6>
            <div class="icons-wrapper">
                <div class="c"><img src="Facebook-Logosu.jpg" alt="jpg"></div>
                <div class="c"><img src="b1a3fab214230557053ed1c4bf17b46c-twitter-icon-logo.jpg" alt="jpg"></div>
                <div class="c"><img src="instagram-logo_971166-164438.jpg" alt="jpg"></div>
                <div class="c"><img src="round-youtube-logo-isolated-white-background_469489-983.jpg" alt="jpg"></div>
            </div>
        </div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4">
            <h6>Active users</h6>
            <h1>1,538</h1>
        </div>
        <div class="div5">
            <h1>DESIGN</h1>
        </div>
        <div class="div6">
            <h1>200k</h1>
        </div>
        <div class="div7"><h3>A place to learn UI Design & <br>Web Design.</h3></div>
    </div>
    </div>
</body>
</html>
