<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .mbox{
        position: relative;

    }
    .box{
        height: 200px;
        width: 200px;
        border: 2px solid black;
        position: absolute;
    }
    .a{
        background-color: black;
        top: 0px;
        left: 0px;
        z-index: 1;
    }
    .b{
        background-color: rgb(117, 0, 0);
        top: 100px;
        left: 100px;
        z-index: 2;
    }
    .c{
        background-color: rgb(11, 218, 166);
        top: 200px;
        left: 200px;
        z-index: 3;
    }
    .d{
        background-color: rgb(46, 2, 240);
        top: 300px;
        left: 300px;
        z-index: 4;
    }
    .e{
        background-color: rgb(21, 230, 14);
        top: 400px;
        left: 400px;
        z-index: 5;
    }
    .f{
        background-color: rgb(214, 22, 189);
        top: 500px;
        left: 500px;
        z-index: 6;
    }
    
</style>
<body>
    <div class="mbox">

        <div class="box a"></div>
        <div class="box b"></div>
        <div class="box c"></div>
        <div class="box d"></div>
        <div class="box e"></div>
        <div class="box f"></div>
    </div>
    
</body>
</html>
