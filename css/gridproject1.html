<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns:repeat(4,100px);
            grid-template-rows: repeat(4,100px);
            grid-template-areas: "header header slidebar slidebar"
             "main main main main"
              "footer footer aside aside";
              gap: 20px;
              height: 100vh;
        }
        .header{ grid-area: header;  background-color: blue;}
        .slidebar{ grid-area: slidebar; background-color: rgb(226, 82, 82); }
        .main{ grid-area: main; background-color:blueviolet;}
        .aside{ grid-area: aside; background-color: chartreuse;}
        .footer{ grid-area: footer; background-color: darkcyan; }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="slidebar"></div>
        <div class="main"></div>
        <div class="aside"></div>
        <div class="footer"></div>
    </div>
</body>
</html>
