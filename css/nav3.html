<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flexcontainer{
            height: 300px;
            width: 100%;
            border: 2px solid black;
            display: flex;
            justify-content: space-between;
            background-color: yellow;
            align-items: center;
        }
        .div1{
            height: 280px;
            width: 280px;
        }
        .circle{
            height: 280px;
            width: 280px;
            border: 2px solid black;
            overflow: hidden;
            border-radius: 50%;
        }   
        .circle img{
            height: 280px;
            width: 280px;
        }
        .div2 ul{
            height: 280px;
            width: 500px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            list-style-type: none;
        }
        .div3{
            width: 600px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .rectengle{
            height: 100px;
            width: 300px;
            border: 2px solid black;
            border-radius: 15%;
        }
        .circle1{
            height: 150px;
            width: 150px;
            border: 2px solid black;
            border-radius: 50%;
        }

    </style>
</head>
<body>
    <div class="flexcontainer">
        <div class="div1">
            <div class="circle">
                <img src="mustang.jpg" alt="/jpg">
            </div>
        </div>
        <div class="div2">
            <ul>
                <li><a href="https://codolio.com/profile/Romil_1911">portfolio</a></li>
                <li><a href="https://leetcode.com/u/Romilbabariya/">leetcode</a></li>
                <li><a href="https://codeforces.com/profile/Romil_1911">codeforces</a></li>
            </ul>
        </div>
        <div class="div3">
            <div class="rectengle"></div>
            <div class="circle1"></div>
        </div>
    </div>
</body>
</html>
