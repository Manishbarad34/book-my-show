<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 300px;
            width: 200px;
            background-color: rgb(53, 35, 70);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(3,150px);
            grid-template-rows: repeat(3,150px);
            gap: 20px;
        }
        .div1{
            grid-column: 1/3;
            grid-row: 1/3;
            background-color: rgb(126, 126, 245);
            border-radius: 40px;
        }
        .div2{
            grid-template-columns: 3/4;
            grid-row: 1/2;
            background-color: rgb(2, 49, 49);
        }
        .div3{
            grid-template-columns: 4/5;
            grid-row: 1/2;
            background-color: rgb(153, 137, 95);
        }
        .div4{
            grid-template-columns: 3/4;
            grid-row: 2/3;
            background-color: rgb(85, 48, 4);
        }
        .div5{
            grid-template-columns: 4/5;
            grid-row: 2/3;
            background-color: rgb(255, 0, 51);
        }
        .div6{
            grid-column: 1/-1;
            background-color: rgb(104, 230, 104);
        }
    </style>
</head>
<body>
    <div class="main">
    <div class="container">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
        <div class="div5"></div>
        <div class="div6"></div>
    </div>
    </div>
</body>
</html>
