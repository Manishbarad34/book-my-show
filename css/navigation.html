<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .class{
        height: 200px;
        width: 100%;
        border: 2px solid black;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: black;
    }
    .circle{
        height: 190px;
        width: 190px;
        border-radius: 50%;
        border: 2px solid black;
        background-color: red;
        
    }
    .square{
        height: 190px;
        width: 190px;
        border: 2px solid black;
        background-color: yellow;
        
    }
    .rectangle{
        height: 190px;
        width: 400px;
        border-radius: 15%;
        border: 2px solid black;
        background-color: orange;
    }
    .div-1 , .div-2 , .div-3 ,.class{
        display: flex;
        justify-content: space-between;
    }
</style>
<body>
    <div class="class">
        <div class="div-1">
            <div class="circle"></div>
        </div>
        <div class="div-2">
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
            <div class="square"></div>
        </div>
        <div class="div-3">
            <div class="rectangle"></div>
            <div class="circle"></div>
        </div>
    </div>

</body>
</html>
